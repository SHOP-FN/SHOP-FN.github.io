<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Catalog</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --vbucks-color: #facc15;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2rem;
      color: var(--accent-color);
      margin-bottom: 8px;
    }

    #status {
      font-size: 1rem;
      color: #94a3b8;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.2);
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background-color: #000;
    }

    .card-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .item-name {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .item-type {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .item-price {
      display: flex;
      align-items: center;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--vbucks-color);
    }

    .vbucks-icon {
      width: 20px;
      height: 20px;
      margin-right: 6px;
    }

    .error-msg {
      text-align: center;
      color: #ef4444;
      font-size: 1.2rem;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <header>
    <h1>Item Catalog</h1>
    <div id="status">読み込み中...</div>
  </header>

  <main id="shop-grid" class="grid-container"></main>

  <script>
    // 最新の仕様に対応したエンドポイント（日本語対応）
    const API_URL = 'https://fortnite-api.com/v2/shop?language=ja';
    const shopGrid = document.getElementById('shop-grid');
    const statusEl = document.getElementById('status');

    async function fetchShopData() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();
        
        if (data.status === 200 && data.data) {
          renderShop(data.data);
        } else {
          showError('ショップデータの取得に失敗しました。');
        }
      } catch (error) {
        console.error('Fetch Error:', error);
        showError('通信エラーが発生しました。時間を置いて再度お試しください。');
      }
    }

    function renderShop(data) {
      statusEl.textContent = `最終更新: ${new Date(data.date).toLocaleString('ja-JP')}`;
      shopGrid.innerHTML = '';

      const entries = data.entries || data.featured?.entries || data.daily?.entries || [];
      renderEntries(entries);
    }

    function renderEntries(entries) {
      if (!entries || entries.length === 0) {
        showError('現在表示できるショップアイテムがありません。');
        return;
      }

      entries.forEach(entry => {
        const item = entry.items && entry.items[0] ? entry.items[0] : entry;
        
        const name = item.name || entry.bundle?.name || '名称不明';
        const type = item.type?.displayValue || 'アイテム';
        const price = entry.finalPrice || entry.regularPrice || 0;
        
        const imageUrl = item.images?.icon || 
                         item.images?.featured || 
                         entry.bundle?.image || 
                         'https://via.placeholder.com/250?text=No+Image';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-img-wrapper">
            <img class="card-img" src="${imageUrl}" alt="${name}" loading="lazy">
          </div>
          <div class="card-content">
            <div>
              <div class="item-name">${escapeHtml(name)}</div>
              <div class="item-type">${escapeHtml(type)}</div>
            </div>
            <div class="item-price">
              <span class="vbucks-icon">🪙</span>
              <span>${price.toLocaleString()}</span>
            </div>
          </div>
        `;

        shopGrid.appendChild(card);
      });
    }

    function showError(message) {
      statusEl.textContent = '';
      shopGrid.innerHTML = `<div class="error-msg">${escapeHtml(message)}</div>`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    fetchShopData();
  </script>
</body>
</html>
